<svg width="1200" height="628" viewBox="0 0 1200 628" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vibra — Get it on Google Play</title>
  <desc id="desc">Banner pubblicitario Vibra con invito a scaricare l'app su Google Play</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="628" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0320"/>
      <stop offset="0.52" stop-color="#241044"/>
      <stop offset="1" stop-color="#090216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(922 120) rotate(130) scale(480 430)">
      <stop stop-color="#B84CFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B84CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="568" y1="154" x2="1010" y2="504" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="button" x1="692" y1="415" x2="1006" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow" x="620" y="354" width="424" height="190" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="orbShadow" x="492" y="105" width="368" height="368" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#A855F7" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="628" rx="28" fill="url(#background)"/>
  <rect width="1200" height="628" rx="28" fill="url(#glow)"/>

  <g opacity="0.45" fill="#fff">
    <circle cx="83" cy="92" r="2"/><circle cx="168" cy="511" r="2"/>
    <circle cx="421" cy="77" r="2"/><circle cx="1103" cy="90" r="2"/>
    <circle cx="1130" cy="525" r="2"/><circle cx="957" cy="564" r="1.5"/>
    <circle cx="333" cy="574" r="1.5"/><circle cx="1024" cy="242" r="1.5"/>
  </g>

  <g filter="url(#orbShadow)" transform="translate(294 0)">
    <circle cx="676" cy="286" r="142" fill="#090B16"/>
    <circle cx="676" cy="286" r="101" fill="url(#accent)"/>
    <circle cx="676" cy="286" r="101" fill="url(#glow)" opacity="0.6"/>
    <path d="M676 347C668 337 627 306 627 271C627 249 643 234 662 234C674 234 683 241 690 251C697 241 706 234 718 234C737 234 753 249 753 271C753 306 712 337 704 347L690 363L676 347Z" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="78" y="188" fill="#D8B4FE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">VIBRA</text>
  <text x="78" y="276" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">Un hub universale.</text>
  <text x="78" y="350" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">Interagisci col mondo.</text>
  <text x="82" y="397" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="23">Servizi, eventi, chat, social, lavoro e casa in un unico spazio.</text>

  <g filter="url(#shadow)">
    <rect x="78" y="458" width="330" height="82" rx="16" fill="url(#button)"/>
    <path d="M109 487L139 499L109 511V487Z" fill="white"/>
    <text x="159" y="489" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1">DISPONIBILE SU</text>
    <text x="159" y="518" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Google Play</text>
  </g>

  <text x="1087" y="568" text-anchor="end" fill="#FFFFFF" fill-opacity="0.5" font-family="Arial, Helvetica, sans-serif" font-size="16">Scarica Vibra</text>
</svg>