  <body style="margin:0;padding:0;background:#0a0118;min-height:100vh;min-height:100dvh;">
    <div id="html-splash" style="position:fixed;inset:0;z-index:99999;background:#0a0118;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease-out;">
      <div style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.3) 0%,rgba(168,85,247,0.1) 50%,transparent 70%);display:flex;align-items:center;justify-content:center;animation:html-splash-pulse 2s ease-in-out infinite;">
        <img src="/favicon.png" alt="" style="width:80px;height:80px;object-fit:contain;border-radius:50%;mix-blend-mode:screen;filter:drop-shadow(0 0 20px rgba(139,92,246,0.6));" />
      </div>
      <div style="margin-top:16px;width:32px;height:32px;border:3px solid rgba(139,92,246,0.2);border-top-color:rgb(139,92,246);border-radius:50%;animation:html-splash-spin 0.8s linear infinite;"></div>
    </div>
    <style>
      @keyframes html-splash-spin { to { transform:rotate(360deg); } }
      @keyframes html-splash-pulse { 0%,100% { transform:scale(1);opacity:0.8; } 50% { transform:scale(1.08);opacity:1; } }
    </style>
    <div id="root"></div>
